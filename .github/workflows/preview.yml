name: Preview Build

on:
  workflow_dispatch:

jobs:
  android-preview:
    name: Android Preview APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL is missing"
            exit 1
          fi

          if [ -z "$DUMMY_PRIVATE_SECRET" ]; then
            echo "DUMMY_PRIVATE_SECRET is missing"
            exit 1
          fi

          echo "Environment variables are configured"

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Build Android preview
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait
