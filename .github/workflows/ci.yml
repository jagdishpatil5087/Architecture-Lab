name: CI

on:
  push:
    branches:
      - main
      - fe/CI-CD

  pull_request:
    branches:
      - main
      - fe/CI-CD

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL is missing"
            exit 1
          fi

          echo "Environment variable is configured"

      - name: Verify private secret
        run: |
          if [ -z "$DUMMY_PRIVATE_SECRET" ]; then
            echo "DUMMY_PRIVATE_SECRET is missing"
            exit 1
          fi

          echo "Private secret is configured"

      - name: expo doctor
        run: npm run doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand
