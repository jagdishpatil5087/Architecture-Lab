name: CI

on:
  push:
    branches:
      - main
      - fe/CI-CD

  pull_request:
    branches:
      - main
      - fe/CI-CD

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL is missing"
            exit 1
          fi

          echo "Environment variable is configured"

      - name: Verify private secret
        run: |
          if [ -z "$DUMMY_PRIVATE_SECRET" ]; then
            echo "DUMMY_PRIVATE_SECRET is missing"
            exit 1
          fi

          echo "Private secret is configured"

      - name: Expo doctor
        run: npm run doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand --coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/

  android-build:
    name: Android Preview Build
    runs-on: ubuntu-latest
    needs: quality

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Build Android preview
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

  production-build:
    name: Android Production Build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    needs: android-build

    environment:
      name: production

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Build Android production
        run: eas build --platform android --profile production --non-interactive

  internal-testing:
    name: Simulate Play Store Internal Testing
    runs-on: ubuntu-latest

    needs: production-build

    environment:
      name: internal-testing

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Find latest production build
        run: |
          eas build:list \
            --platform android \
            --profile production \
            --limit 1 \
            --non-interactive

      - name: Simulate Play Store Internal Testing
        run: |
          echo "=========================================="
          echo " Google Play Internal Testing"
          echo "=========================================="
          echo ""
          echo "Application: Architecture Lab"
          echo "Platform: Android"
          echo "Profile: production"
          echo "Track: internal"
          echo ""
          echo "Production AAB:"
          echo "Build ID: cd17296c-0ef1-4ea1-b4d8-d6fb989383af"
          echo "Version: 1.0.0"
          echo "Version Code: 2"
          echo ""
          echo "Status: SIMULATED"
          echo ""
          echo "=========================================="
