name: CD

on:
  push:
    branches:
      - main

jobs:
  production-build:
    name: Android Production Build
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      DUMMY_PRIVATE_SECRET: ${{ secrets.DUMMY_PRIVATE_SECRET }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Build Android production
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

  internal-testing:
    name: Simulate Play Store Internal Testing
    runs-on: ubuntu-latest

    needs: production-build

    environment:
      name: internal-testing

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS authentication
        run: eas whoami

      - name: Get latest production build
        run: |
          eas build:list \
            --platform android \
            --profile production \
            --limit 1 \
            --non-interactive

      - name: Create release metadata
        run: |
          mkdir -p deployment

          cat > deployment/release-info.json <<EOF
          {
            "app": "Architecture Lab",
            "platform": "android",
            "profile": "production",
            "track": "internal",
            "status": "simulated",
            "commit": "${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}"
          }
          EOF

          cat deployment/release-info.json

      - name: Simulate Play Store Internal Testing
        run: |
          echo "=========================================="
          echo " Google Play Internal Testing"
          echo "=========================================="
          echo ""
          echo "Application: Architecture Lab"
          echo "Platform: Android"
          echo "Profile: production"
          echo "Track: internal"
          echo ""
          echo "Production AAB:"
          echo "Latest production build discovered from EAS"
          echo ""
          echo "Status: SIMULATED"
          echo ""
          echo "The AAB would be uploaded to:"
          echo "Google Play → Internal Testing"
          echo ""
          echo "=========================================="

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: play-store-internal-release
          path: deployment/release-info.json
